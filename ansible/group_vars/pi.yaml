# ---- general ----
homelab_root: /opt/homelab
timezone: "America/Chicago"

# ---- pihole ----
pihole_dir: "{{ homelab_root }}/pihole"
pihole_web_password: "CHANGE_ME"   # move to vault later
pihole_dns_1: "1.1.1.1"
pihole_dns_2: "8.8.8.8"

# ---- wg-easy / wireguard ----
wg_easy_dir: "{{ homelab_root }}/wg-easy"
wg_host: "your.public.dns.or.ip"   # e.g. DDNS name, or public IP for initial testing
wg_password_hash: "$2b$12$4Lwrep2Okwu/idXMd6nEaeJQqin1zxpE9yy3tQl3b/34iBxlamlTO"
wg_port: 51820
wg_ui_port: 51821
wg_allowed_ips: "0.0.0.0/0, ::/0"   # full tunnel; for split tunnel use your LAN CIDR like 192.168.1.0/24
lan_cidr: "192.168.1.0/24"          # adjust to your LAN
