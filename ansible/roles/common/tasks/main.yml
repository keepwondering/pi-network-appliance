- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install baseline packages
  apt:
    update_cache: true
    name:
      - ca-certificates
      - curl
      - git
      - ufw
    state: present

- name: Enable IPv4 forwarding for VPN
  copy:
    dest: /etc/sysctl.d/99-ipforward.conf
    mode: "0644"
    content: |
      net.ipv4.ip_forward=1

- name: Apply sysctl settings
  command: sysctl --system
  changed_when: false

# DNS (Pi-hole)
- name: Allow DNS TCP 53
  ufw:
    rule: allow
    port: "53"
    proto: tcp

- name: Allow DNS UDP 53
  ufw:
    rule: allow
    port: "53"
    proto: udp

# HTTP for Pi-hole UI
- name: Allow HTTP 80
  ufw:
    rule: allow
    port: "80"
    proto: tcp

# WireGuard UDP
- name: Allow WireGuard UDP
  ufw:
    rule: allow
    port: "{{ wg_port }}"
    proto: udp

# wg-easy UI (recommend: restrict to LAN later)
- name: Allow wg-easy UI TCP (LAN)
  ufw:
    rule: allow
    port: "{{ wg_ui_port }}"
    proto: tcp
    from_ip: "{{ lan_cidr }}"

- name: Allow wg-easy UI TCP (WireGuard)
  ufw:
    rule: allow
    port: "{{ wg_ui_port }}"
    proto: tcp
    from_ip: "{{ wg_vpn_cidr | default('10.8.0.0/24') }}"

- name: Install OpenSSH server
  apt:
    name: openssh-server
    state: present

- name: Allow SSH
  ufw:
    rule: allow
    port: "22"
    proto: tcp

# Docker + UFW: allow forwarded traffic (needed for container networking)
- name: Ensure UFW forward policy allows docker traffic
  lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

- name: Reload UFW (apply forward policy change)
  command: ufw reload
  changed_when: false
  failed_when: false

- name: Enable UFW
  ufw:
    state: enabled

# --- Avoid Pi-hole DNS loop: ensure the Pi host uses public DNS (NetworkManager) ---
- name: Check if nmcli exists
  command: which nmcli
  register: nmcli_exists
  changed_when: false
  failed_when: false

- name: Gather active NetworkManager connections
  command: "nmcli -t -f DEVICE,NAME connection show --active"
  register: nmcli_active
  changed_when: false
  when: nmcli_exists.rc == 0

- name: Pick active interface for DNS configuration
  set_fact:
    nm_target_iface: >-
      {{
        'eth0' if (nmcli_active.stdout_lines | select('match', '^eth0:') | list | length) > 0
        else 'wlan0'
      }}
  when: nmcli_exists.rc == 0

- name: Pick active NM connection name for chosen interface
  set_fact:
    nm_connection_name: >-
      {{
        (nmcli_active.stdout_lines
          | select('match', '^' ~ nm_target_iface ~ ':')
          | list
          | first
          | regex_replace('^' ~ nm_target_iface ~ ':', '')
        )
      }}
  when: nmcli_exists.rc == 0

- name: Fail if no active NetworkManager connection found
  fail:
    msg: "No active NetworkManager connection found. Active: {{ nmcli_active.stdout }}"
  when: nmcli_exists.rc == 0 and (nm_connection_name is not defined or nm_connection_name | length == 0)

- name: Configure host to ignore router DNS + use public DNS (prevents Pi-hole loop)
  command: >
    nmcli connection modify "{{ nm_connection_name }}"
    ipv4.ignore-auto-dns yes
    ipv4.dns "{{ host_dns_1 }} {{ host_dns_2 }}"
    ipv4.dns-priority -10
  changed_when: true
  when: nmcli_exists.rc == 0

- name: Disable IPv6 on host connection (avoid router IPv6 DNS)
  command: >
    nmcli connection modify "{{ nm_connection_name }}"
    ipv6.ignore-auto-dns yes
    ipv6.method ignore
  changed_when: true
  when: nmcli_exists.rc == 0

# SAFE: do not bring interface down (keeps SSH alive)
- name: Reapply NetworkManager connection (safe)
  command: nmcli connection up "{{ nm_connection_name }}"
  changed_when: true
  failed_when: false
  when: nmcli_exists.rc == 0
