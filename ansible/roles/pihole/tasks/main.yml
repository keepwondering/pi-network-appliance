# ansible/roles/pihole/tasks/main.yml

- name: Create pihole directory
  file:
    path: "{{ pihole_dir }}"
    state: directory
    mode: "0755"

- name: Copy pihole compose file
  copy:
    src: compose.yml
    dest: "{{ pihole_dir }}/compose.yml"
    mode: "0644"

- name: Render pihole env file
  template:
    src: pihole.env.j2
    dest: "{{ pihole_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Start Pi-hole
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_dir }}"
    files:
      - compose.yml
    state: present

- name: Add split-DNS record for WIMS (LAN override)
  lineinfile:
    path: "{{ pihole_dir }}/etc-pihole/custom.list"
    create: true
    line: "{{ wims_lan_ip }} {{ wims_fqdn }}"
    state: present
  notify: Restart Pi-hole DNS

- name: Show Pi-hole listening mode and upstreams
  command: >-
    docker exec pihole sh -lc
    "grep -E 'listeningMode|upstreams' /etc/pihole/pihole.toml"
  register: pihole_dns_settings
  changed_when: false

- name: Debug DNS settings
  debug:
    var: pihole_dns_settings.stdout_lines

- name: Verify Pi-hole resolves DNS locally
  command: docker exec pihole sh -lc "dig google.com @127.0.0.1"
  register: pihole_forward_verify
  changed_when: false

- name: Show DNS verification
  debug:
    var: pihole_forward_verify.stdout_lines
