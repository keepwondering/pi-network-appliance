- name: Create pihole directory
  file:
    path: "{{ pihole_dir }}"
    state: directory
    mode: "0755"

- name: Copy pihole compose file
  copy:
    src: compose.yml
    dest: "{{ pihole_dir }}/compose.yml"
    mode: "0644"

- name: Render pihole env file
  template:
    src: pihole.env.j2
    dest: "{{ pihole_dir }}/.env"
    mode: "0600"

- name: Start Pi-hole
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_dir }}"
    files:
      - compose.yml
    state: present

- name: Add split-DNS record for WIMS (LAN override)
  lineinfile:
    path: "{{ pihole_dir }}/etc-pihole/custom.list"
    create: true
    line: "{{ wims_lan_ip }} {{ wims_fqdn }}"
    state: present

- name: Force Pi-hole upstream DNS servers (idempotent enough)
  command: docker exec pihole pihole -a setdns {{ pihole_dns_1 }} {{ pihole_dns_2 }}
  changed_when: true
  failed_when: false

- name: Restart Pi-hole DNS after upstream change
  command: docker exec pihole pihole restartdns
  changed_when: true
  failed_when: false

- name: Set Pi-hole web password (best-effort)
  command: docker exec pihole pihole setpassword "{{ pihole_web_password }}"
  changed_when: false
  failed_when: false
